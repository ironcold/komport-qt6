name: Bug report
description: Report a reproducible problem in Komport-Qt6
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug. Remove credentials and sensitive device output before submitting.
  - type: input
    id: version
    attributes:
      label: Komport-Qt6 version
      description: Enter a release version or commit hash.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Linux distribution, desktop environment, and Qt version.
      placeholder: Debian 13, KDE Plasma 6, Qt 6.8
    validations:
      required: true
  - type: input
    id: serial_setup
    attributes:
      label: Serial setup
      description: Device class and relevant baud, framing, flow-control, and line-ending settings.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable sequence that triggers the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Add relevant logs, screenshots, or raw byte sequences. Remove credentials and private device data.
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed credentials and sensitive data from this report.
          required: true
        - label: This is not a security vulnerability; those are reported according to SECURITY.md.
          required: true
